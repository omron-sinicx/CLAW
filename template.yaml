teaser: teaser.mp4
overview: |
  Safety is a critical challenge in robot learning for contact-rich manipulation tasks, where unexpected collisions can cause damage and hinder learning. This study introduces a low-cost robot learning system that combines a novel soft end-effector, **CLAW** (**C**ompliant **L**eaf‑spring in **A**nisotropic soft **W**rist), with an intuitive haptic teleoperation interface for position-controlled robots.

  CLAW addresses key limitations of existing soft end-effectors by providing large 6-degree-of-freedom deformation, adjustable anisotropic stiffness, and lightweight (330g) construction at a low cost (~$550). Using an imitation learning approach, our system achieved a **76% success rate** in benchmark peg-insertion tasks, significantly outperforming both fin-ray-type (43%) and rigid grippers (36%).

  The system integrates both fail-soft capabilities (enabling robots to safely withstand collisions) and fault-avoidance features (providing haptic feedback for safer teleoperation).

body:
  - title: System Overview
    text: |
      The proposed system integrates three main components to enable safe robot learning for contact-rich manipulation:

      <div class="uk-text-center">
        <img src="method.png" alt="CLAW System Overview" class="uk-align-center uk-responsive-width" />
        <div class="uk-text-meta">Safe robot learning system overview: (a) novel soft end-effector CLAW, (b) haptic-feedback teleoperation interface, and (c) variety of contact-rich tasks</div>
      </div>

      1. **CLAW Soft End-Effector**: A compliant leaf-spring design providing 6-DoF deformation and anisotropic stiffness
      2. **Haptic Teleoperation Interface**: Position-controlled robot with force feedback for intuitive demonstrations  
      3. **Imitation Learning**: Action Chunking Transformer (ACT) method for policy learning from demonstrations

  - title: CLAW Design and Performance
    text: |
      CLAW (**C**ompliant **L**eaf‑spring in **A**nisotropic soft **W**rist) is designed to meet four key requirements:

      - **Large and multi-directional deformation**: 6-DoF compliance to absorb unexpected collisions
      - **Anisotropic and adjustable stiffness**: Direction-dependent stiffness with three lock modes
      - **Lightweight construction**: Only 330g total mass 
      - **Low cost and simple implementation**: ~$550 using readily available components

      #### Technical Specifications
      <div style="display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; align-items: center; margin: 16px 0;">
        <div style="flex: 1; min-width: 200px;">
          <table style="width: 100%; font-size: 14px; border-collapse: collapse;">
            <tr><td style="font-weight: bold; padding: 4px 8px; border-bottom: 1px solid #ddd;">Weight</td><td style="padding: 4px 8px; border-bottom: 1px solid #ddd;">330 g</td></tr>
            <tr><td style="font-weight: bold; padding: 4px 8px; border-bottom: 1px solid #ddd;">Size (W×H×L)</td><td style="padding: 4px 8px; border-bottom: 1px solid #ddd;">155×150×85 mm</td></tr>
            <tr><td style="font-weight: bold; padding: 4px 8px;">Max Grip Force</td><td style="padding: 4px 8px;">7.5 N</td></tr>
          </table>
        </div>
        <div style="flex: 1; min-width: 200px;">
          <table style="width: 100%; font-size: 14px; border-collapse: collapse;">
            <tr><td colspan="2" style="font-weight: bold; padding: 4px 8px; border-bottom: 1px solid #ddd; text-align: center;">Deformation Range</td></tr>
            <tr><td style="padding: 4px 8px; border-bottom: 1px solid #ddd;">X/Y-axis</td><td style="padding: 4px 8px; border-bottom: 1px solid #ddd;">±40 mm</td></tr>
            <tr><td style="padding: 4px 8px; border-bottom: 1px solid #ddd;">Z-axis</td><td style="padding: 4px 8px; border-bottom: 1px solid #ddd;">+20/-10 mm</td></tr>
            <tr><td style="padding: 4px 8px; border-bottom: 1px solid #ddd;">Pitch/Roll</td><td style="padding: 4px 8px; border-bottom: 1px solid #ddd;">±15°</td></tr>
            <tr><td style="padding: 4px 8px;">Yaw</td><td style="padding: 4px 8px;">±30°/±45°</td></tr>
          </table>
        </div>
      </div>

      <div class="uk-text-center">
        <div style="margin-top: 24px;">
          <img src="deformation.png" alt="CLAW Deformation" class="uk-align-center uk-responsive-width" />
          <div class="uk-text-meta">CLAW deformation capabilities in multiple directions</div>
        </div>
      </div>

      <div class="uk-text-center">
        <div style="margin-top: 24px;">
          <img src="lock.png" alt="CLAW Locking Modes" class="uk-align-center uk-responsive-width" style="width: 50%; max-width: 50%;" />
          <div class="uk-text-meta">Three locking modes create selective variable stiffness: (a) Free mode allows full compliance, (b) Half lock mode provides anistropic stiffness, (c) Full lock mode maximizes rigidity for force transmission</div>
        </div>
      </div>

  - title: Teleoperation Interface
    text: |
      We open source a bilateral teleoperation interface designed for position-based robots with force sensors at the end effector. The system provides intuitive haptic feedback for safer and more effective robot control, particularly beneficial for contact-rich manipulation tasks.

      <div class="teleop-container" style="display: flex; gap: 24px; align-items: center; margin-bottom: 16px;">
        <div class="teleop-left" style="flex: 0 0 70%; text-align: center; display: flex; flex-direction: column; justify-content: center;">
          <img src="teleop.png" alt="Teleoperation System Diagram" style="width: 100%; max-width: 100%;" />
          <div class="uk-text-meta">Bilateral teleoperation system architecture with force feedback and gravity compensation</div>
        </div>
        <div class="teleop-right" style="flex: 0 0 30%; text-align: center; display: flex; flex-direction: column; justify-content: center;">
          <img src="teleop_real.png" alt="Physical Teleoperation Setup" style="width: 100%; max-width: 100%;" />
          <div class="uk-text-meta">Physical setup showing leader device with lever mechanism for stiffness selection and follower robot with CLAW</div>
        </div>
      </div>


      The interface features a lever mechanism for intuitive stiffness selection, allowing operators to switch between different compliance modes during teleoperation. This human-in-the-loop approach enables more natural and safe interaction with the environment while leveraging the variable stiffness capabilities of the CLAW end-effector.

  - title: Real-world Manipulation Tasks
