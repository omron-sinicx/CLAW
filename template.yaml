      ### Variable Stiffness Demonstrations

      <div style="text-align: center; margin-bottom: 16px;">
        <div style="font-weight: bold; margin-bottom: 6px;">Door Opening Task</div>
        <div style="display: flex; gap: 24px; align-items: stretch; justify-content: center; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 300px; max-width: 500px;">
            <video
              src="opening_door.mp4"
              controls
              loop
              muted
              style="width: 100%; height: 100%; object-fit: cover;"
            />
          </div>
          <div style="flex: 1; min-width: 300px; max-width: 500px;">
            <img 
              src="door_opening.png" 
              alt="Door Opening Force Analysis" 
              style="width: 100%; height: 100%; object-fit: contain;"
            />
          </div>
        </div>
        <div style="margin-top: 12px; text-align: left; max-width: 1000px; margin-left: auto; margin-right: auto;">
          <div class="uk-text-meta">
            This experiment demonstrates the benefit of variable stiffness: <strong>full lock mode</strong> is used during the push/rotation phase to efficiently transmit torque, then switches to <strong>free mode</strong> once the latch releases, allowing the door handle's return spring to set the final pose without robot resistance. This human-like strategy reduces the need for precise "rotate-back" motions and improves generalization across different door mechanisms.
          </div>
        </div>
      </div>

      <div style="text-align: center; margin-bottom: 16px;">
        <div style="font-weight: bold; margin-bottom: 6px;">Key Insertion</div>
        <video
          src="var_stiffness_key_Q.mp4"
          controls
          loop
          muted
          style="width: 100%; max-width: 600px;"
        />
        <div class="uk-text-meta">Variable stiffness demonstration with key insertion</div>
        <div style="margin-top: 16px; text-align: left; max-width: 600px; margin-left: auto; margin-right: auto; padding: 12px; background-color: rgba(0,0,0,0.05); border-radius: 6px;">
          <div style="color: #333; font-size: 14px; line-height: 1.5;">
            This task demonstrates the strategic use of variable stiffness: <strong>high soft mode</strong> is used for initial contact and hole alignment, allowing the key to find the correct orientation without applying excessive force. Once aligned, <strong>lock mode</strong> is engaged for effective torque transmission during rotation and pulling out, providing the necessary rigidity for the rotational motion and extraction phases.
          </div>
        </div>
      </div>

