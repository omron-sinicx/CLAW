            <tr><td style="font-weight: bold; padding: 4px 8px; border-bottom: 1px solid #ddd;">Size (W×H×L)</td><td style="padding: 4px 8px; border-bottom: 1px solid #ddd;">155×150×85 mm</td></tr>
            <tr><td style="font-weight: bold; padding: 4px 8px;">Max Grip Force</td><td style="padding: 4px 8px;">7.5 N</td></tr>
