  - title: Teleoperation Interface
    text: |
      We open source a bilateral teleoperation interface designed for position-based robots with force sensors at the end effector. The system provides intuitive haptic feedback for safer and more effective robot control, particularly beneficial for contact-rich manipulation tasks.

      <div class="teleop-container" style="display: flex; gap: 24px; align-items: center; margin-bottom: 16px;">
        <div class="teleop-left" style="flex: 0 0 70%; text-align: center; display: flex; flex-direction: column; justify-content: center;">
          <img src="teleop.png" alt="Teleoperation System Diagram" style="width: 100%; max-width: 100%;" />
          <div class="uk-text-meta">Bilateral teleoperation system architecture with force feedback and gravity compensation</div>
        </div>
        <div class="teleop-right" style="flex: 0 0 30%; text-align: center; display: flex; flex-direction: column; justify-content: center;">
          <img src="teleop_real.png" alt="Physical Teleoperation Setup" style="width: 100%; max-width: 100%;" />
          <div class="uk-text-meta">Physical setup showing leader device with lever mechanism for stiffness selection and follower robot with CLAW</div>
        </div>
      </div>


      The interface features a lever mechanism for intuitive stiffness selection, allowing operators to switch between different compliance modes during teleoperation.

