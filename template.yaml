teaser: teaser.png
overview: |
  Safety is a critical challenge in robot learning for contact-rich manipulation tasks, where unexpected collisions can cause damage and hinder learning. This study introduces a low-cost robot learning system that combines a novel soft end-effector, **CLAW** (**C**ompliant **L**eaf‑spring in **A**nisotropic soft **W**rist), with an intuitive haptic teleoperation interface for position-controlled robots.

  CLAW addresses key limitations of existing soft end-effectors by providing large 6-degree-of-freedom deformation, adjustable anisotropic stiffness, and lightweight (330g) construction at a low cost (~$550). Using an imitation learning approach, our system achieved a **76% success rate** in benchmark peg-insertion tasks, significantly outperforming both fin-ray-type (43%) and rigid grippers (36%).

  The system integrates both fail-soft capabilities (enabling robots to safely withstand collisions) and fault-avoidance features (providing haptic feedback for safer teleoperation).

body:
  - title: System Overview
    text: |
      The proposed system integrates three main components to enable safe robot learning for contact-rich manipulation:

      <div class="uk-text-center">
        <img src="method.png" alt="CLAW System Overview" class="uk-align-center uk-responsive-width" />
        <div class="uk-text-meta">Safe robot learning system overview: (a) novel soft end-effector CLAW, (b) haptic-feedback teleoperation interface, and (c) variety of contact-rich tasks</div>
      </div>

      1. **CLAW Soft End-Effector**: A compliant leaf-spring design providing 6-DoF deformation and anisotropic stiffness
      2. **Haptic Teleoperation Interface**: Position-controlled robot with force feedback for intuitive demonstrations  
      3. **Imitation Learning**: Action Chunking Transformer (ACT) method for policy learning from demonstrations

  - title: CLAW Design and Performance
    text: |
      CLAW (**C**ompliant **L**eaf‑spring in **A**nisotropic soft **W**rist) is designed to meet four key requirements:

      - **Large and multi-directional deformation**: 6-DoF compliance to absorb unexpected collisions
      - **Anisotropic and adjustable stiffness**: Direction-dependent stiffness with three lock modes
      - **Lightweight construction**: Only 330g total mass 
      - **Low cost and simple implementation**: ~$550 using readily available components

      <div class="uk-grid-small uk-child-width-1-2@s uk-text-center" uk-grid>
        <div>
          <img src="result1.png" alt="CLAW Success Rates" class="uk-align-center uk-responsive-width" />
          <div class="uk-text-meta">Success rates showing CLAW outperforming Fin Ray and rigid grippers</div>
        </div>
        <div>
          <img src="result2.png" alt="CLAW Deformation" class="uk-align-center uk-responsive-width" />
          <div class="uk-text-meta">CLAW deformation capabilities in multiple directions</div>
        </div>
      </div>

  - title: Experimental Results
    text: |
      We evaluated CLAW against two baseline grippers using the FMB (Functional Manipulation Benchmark) assembly board:

      #### Success Rates on Peg-in-Hole Tasks
      |Gripper Type|Success Rate|Key Characteristics|
      |--|--|--|
      |**CLAW (haptic)** | **76%** | Lowest contact forces, zero emergency stops|
      |CLAW (no haptic) | 72% | Good performance without haptic feedback|
      |Fin Ray (parallel) | 43% | Moderate forces, some emergency stops|
      |Fin Ray (perpendicular) | 41% | Higher forces, occasional stops|
      |Rigid gripper | 36% | Highest forces, frequent emergency stops|

      #### Safety Metrics
      |Metric|CLAW (haptic)|CLAW (no haptic)|Fin Ray|Rigid|
      |--|--|--|--|--|
      |**Normal force [N]** | **2.922 ± 3.332** | 3.854 ± 4.673 | 4.092 ± 4.479 | 6.656 ± 6.214 |
      |**Emergency stops**   | **0** | 0 | 6 | 9 |

      CLAW demonstrated superior performance with significantly lower contact forces and zero emergency stops, confirming both improved task success and enhanced safety.

